 */
                               
                                                                   
                    
                           
                         
       
                                               
                                                                  
                                                       
       
                      
                        
                      
                            
                      
       
                                                  
                                                
                                                        
                                                                        
       
                         
 

/** 运行时附加属性：调制参数 + 惯性零点（= perfectMs，保证完美时机位移为 0） */
                                                   
                   
 

/** 无调制默认值（旧数据 / 手工构造 mover 走这条） */
const MOTION_OFF              = {
    sineAmp: 0,
    sinePeriodMs: 960,
    sinePhase: 0,
    inertiaPx: 0,
    inertiaHz: 1,
    inertiaPhase: 0,
    zeroMs: 0,
};

/** 读 mover 的运动调制（无附加属性 → 零调制，绝不抛错） */
function moverMotion(mover              )              {
    const m = (mover                                           ).motion;
    return m ?? MOTION_OFF;
}

/**
 * v0.6 双物体错拍参数（可缺省）：
 *  - `phase2` 第二个 mover 的时间相位偏移（按周期比例，0–0.5），默认 0 = 同步；
 *  - `cycle2Ms` 第二个 mover 的周期（600–4000），0 = 与第一个相同。
 * `phase2 === 0 && cycle2Ms === 0` 时必须与 v0.5 **逐位相同**（靠 localT 的零偏移兼容分支保证）。
 */
                            
                   
                     
                                                       
                         
 

const DUO_OFF            = { phase2: 0, cycle2Ms: 0, timeLimitSec: 0 };

/**
 * 单个 mover 的时间轴（v0.6）：
 *  - `offsetMs`：本 mover 的时间轴相对关卡时钟的后移量（第二 mover = phase2 × cycle2Ms）；
 *  - `perfectMs`：**本 mover 自己**的完美时刻（= 自身 tStar + offsetMs）。
 * 「谁已定格」是会话状态，**不放这里**（core 保持零状态）：由调用方用 `judgeNearest(rt,t,skipIdx)` 传入。
 */
                              
                     
                      
 

const TIMING_OFF              = { offsetMs: 0, perfectMs: 0 };

/** 读 mover 的时间轴（旧数据/手工构造 → offset 0，等价 v0.5） */
function moverTiming(mover              )              {
    const t = (mover                                           ).timing;
    return t ?? TIMING_OFF;
}

/**
 * 关卡时钟 → 本 mover 的本地时间（已按自身周期取模）。
 *
 * **零偏移兼容分支（禁改）**：`offsetMs === 0` 时返回 `wrapT(tMs, cycleMs)`，
 * 与 v0.5 完全同一串浮点运算 —— S13（phase_2=0 的关逐位不变）依赖它。
 */
function localT(mover              , tMs        )         {
    const off = moverTiming(mover).offsetMs;
    if (off === 0) return wrapT(tMs, mover.cycleMs);
    return wrapT(tMs - off, mover.cycleMs);
}

/** 轨迹模板全集（与 Types.PathId 一一对应；顺序 = 文档顺序） */
const PATH_IDS           = ['h_line', 'h_line_rl', 'diag_dl', 'diag_ur', 'arc_up', 'arc_down', 'bounce_floor'];

/** 贝塞尔采样段数：40 段 → 折线与真实曲线的最大偏差 < 0.35px（720 宽屏上肉眼不可见） */
const ARC_SAMPLES = 40;

/** 两段变速的切换点（占整周期比例），写死 = 可练可背，不随机 */
const SPEED_SWITCH = 0.4;

/** 弧线起点/落点的水平范围（世界坐标，与 Layout 的可玩区对齐） */
const ARC_X0 = 80;
const ARC_X1 = 640;
/** 弧线端点离可玩区下沿的距离 */
const ARC_MARGIN_BOTTOM = 60;

/** 生成轨迹折线（世界坐标）。同一 (pathId, C) 必须返回完全相同的点列。 */
function buildPathPts(pathId        , c      , samples         = ARC_SAMPLES)         {
    switch (pathId) {
        case 'h_line':
            return [v(-180, c.y), v(900, c.y)];
        case 'h_line_rl':
            return [v(900, c.y), v(-180, c.y)];
        case 'diag_dl':
            return [v(c.x - 360, c.y - 220), v(c.x + 360, c.y + 220)];
        case 'diag_ur':
            return [v(c.x - 360, c.y + 220), v(c.x + 360, c.y - 220)];
        case 'arc_up': {
            // 二次贝塞尔 P0 / P2 在屏幕下方，控制点取 Pc = 2C − (P0+P2)/2 ⇒ 曲线在 s=0.5 处严格过 C
            const pts = sampleQuadBezier(c, false, samples);
            return pts;
        }
        case 'arc_down': {
            // arc_up 关于 y = C.y 镜像
            return sampleQuadBezier(c, true, samples);
        }
        case 'bounce_floor':
            // 左上落下 → 触地反弹 → 上穿目标中心 → 飞出
            return [v(-120, 120), v(195, PLAY.bottom - 40), v(c.x, c.y), v(525, 300), v(860, 120)];
        default:
            throw new Error(`未知路径模板: ${String(pathId)}`);
    }
}

/** 二次贝塞尔采样；mirrorY=true 时整体关于 y = C.y 镜像（= arc_down） */
function sampleQuadBezier(c      , mirrorY         , samples        )         {
    const yBase = PLAY.bottom + ARC_MARGIN_BOTTOM;
    const p0x = ARC_X0;
    const p2x = ARC_X1;
    const p0y = yBase;
    const p2y = yBase;
    const pcy = 2 * c.y - (p0y + p2y) / 2;
    const pcx = 2 * c.x - (p0x + p2x) / 2;
    const out         = [];
    const n = Math.max(2, samples);
    for (let i = 0; i <= n; i++) {
        const s = i / n;
        const w0 = (1 - s) * (1 - s);
        const w1 = 2 * s * (1 - s);
        const w2 = s * s;
        const x = w0 * p0x + w1 * pcx + w2 * p2x;
        const y = w0 * p0y + w1 * pcy + w2 * p2y;
        out.push(v(x, mirrorY ? 2 * c.y - y : y));
    }
    return out;
}

/** 累计弧长数组（cum[i] = 0..i 号点的长度，cum[n] = 总长） */
function cumulativeLengths(pts        )           {
    const cum           = new Array(pts.length);
    cum[0] = 0;
    for (let i = 1; i < pts.length; i++) {
        const dx = pts[i].x - pts[i - 1].x;
        const dy = pts[i].y - pts[i - 1].y;
        cum[i] = cum[i - 1] + Math.hypot(dx, dy);
    }
    return cum;
}

function pathLength(pts        )         {
    let s = 0;
    for (let i = 1; i < pts.length; i++) {
        s += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    }
    return s;
}

/**
 * 路径上离 C 最近的点对应的弧长比例 uStar（0–1）。
 * - 折线顶点恰好等于 C 时（diag / arc / bounce）返回该顶点的弧长比例，误差 0；
 * - 直线路径（h_line）返回 C 在段上的投影位置（= 0.5）。
 */
function uStarOf(pts        , cum          , total        , c      )         {
    if (total <= 1e-9) return 0;
    let bestD = Infinity;
    let bestU = 0;
    for (let i = 0; i + 1 < pts.length; i++) {
        const a = pts[i];
        const b = pts[i + 1];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const segLen2 = dx * dx + dy * dy;
        let t = segLen2 > 1e-12 ? ((c.x - a.x) * dx + (c.y - a.y) * dy) / segLen2 : 0;
        t = clamp(t, 0, 1);
        const px = a.x + dx * t;
        const py = a.y + dy * t;
        const d = Math.hypot(px - c.x, py - c.y);
        if (d < bestD - 1e-9) {
            bestD = d;
            bestU = (cum[i] + Math.hypot(px - a.x, py - a.y)) / total;
        }
    }
    return clamp(bestU, 0, 1);
}

/** 弧长比例 u → 折线上的点 */
function pointAtU(pts        , cum          , total        , u        )       {
    const target = clamp(u, 0, 1) * total;
    const n = pts.length;
    if (n === 0) return v(0, 0);
    if (n === 1 || total <= 1e-9) return v(pts[0].x, pts[0].y);
    // 二分找所在段（线性查找也够快，但二分让 40+ 段的大路径稳定 O(log n)）
    let lo = 0;
    let hi = n - 1;
    while (hi - lo > 1) {
        const mid = (lo + hi) >> 1;
        if (cum[mid] <= target) lo = mid;
        else hi = mid;
    }
    const segLen = cum[hi] - cum[lo];
    const t = segLen > 1e-12 ? (target - cum[lo]) / segLen : 0;
    return v(pts[lo].x + (pts[hi].x - pts[lo].x) * t, pts[lo].y + (pts[hi].y - pts[lo].y) * t);
}

/** 两段变速的权重：返回 [前段倍率, 后段倍率, 归一化分母, 切换时刻(ms)] */
function speedProfile(speedStage        , cycleMs        )                                                             {
    const k1 = clamp(speedStage, 0.5, 1.5);
    const k2 = 2 - k1;
    // 总距离不变：k1·0.4 + k2·0.6 = 1（匀速时 k1=k2=1）
    const norm = SPEED_SWITCH * k1 + (1 - SPEED_SWITCH) * k2;
    return { k1, k2, norm, switchMs: SPEED_SWITCH * cycleMs };
}

/**
 * 正弦速度调制的位移积分（v0.5 带相位）：
 *   ∫₀ᵗ (1 + amp·sin(2π(τ/T + φ))) dτ = t + (amp·T/(2π))·[cos(2πφ) − cos(2π(t/T + φ))]
 * 单位：秒。
 *
 * **相位 0 兼容分支（禁改）**：φ === 0 时走 `t + (amp/w)(1 − cos(wt))`，与 v0.4 逐位相同。
 * S8（季 1 三窗口逐位回归）依赖这条分支；要合并两条公式前先想清楚浮点顺序会变。
 */
function sineIntegral(tSec        , amp        , periodSec        , phase         = 0)         {
    if (amp === 0) return tSec;
    const w = (2 * Math.PI) / Math.max(1e-6, periodSec);
    if (phase === 0) return tSec + (amp / w) * (1 - Math.cos(w * tSec));
    const ph = 2 * Math.PI * phase;
    return tSec + (amp / w) * (Math.cos(ph) - Math.cos(w * tSec + ph));
}

/**
 * 带正弦调制（含相位）的 u(t)：距离积分 / 总积分（v0 被约掉，与路径长无关）。
 * 单调性：amp < 1 时被积函数 1 + amp·sin(·) > 0，故严格单调 → 完美时机唯一（与相位无关）。
 */
function uOfTSine(
    tMs        ,
    cycleMs        ,
    speedStage        ,
    sineAmp        ,
    sinePeriodMs        ,
    sinePhase         = 0,
)         {
    if (!(cycleMs > 0)) return 0;
    const t = clamp(tMs, 0, cycleMs);
    const p = speedProfile(speedStage, cycleMs);
    const periodSec = Math.max(1, sinePeriodMs) / 1000;
    const iT = sineIntegral(t / 1000, sineAmp, periodSec, sinePhase);
    const iS = sineIntegral(p.switchMs / 1000, sineAmp, periodSec, sinePhase);
    const iC = sineIntegral(cycleMs / 1000, sineAmp, periodSec, sinePhase);
    const total = p.k1 * iS + p.k2 * (iC - iS);
    if (!(Math.abs(total) > 1e-12)) return 0;
    const d = t <= p.switchMs ? p.k1 * iT : p.k1 * iS + p.k2 * (iT - iS);
    return clamp(d / total, 0, 1);
}

/**
 * 时间（ms，已按周期取模）→ 弧长比例 u（0–1）。单调递增，u(0)=0，u(cycleMs)=1。
 *
 * **关键兼容性**：sineAmp === 0 时走 v0.3 的原始算式（不是「数学等价」而是「逐位相同」），
 * 这是 S8 回归（季 1 三窗口与 v0.3 逐位一致）的唯一保证方式。
 */
function uAt(mover              , tMs        )         {
    const m = moverMotion(mover);
    if (m.sineAmp === 0) return uAtUnmodulated(mover, tMs);
    const cycle = mover.cycleMs;
    if (!(cycle > 0) || !(mover.pathLen > 0)) return 0;
    return uOfTSine(clamp(localT(mover, tMs), 0, cycle), cycle, mover.speedStage, m.sineAmp, m.sinePeriodMs, m.sinePhase);
}

/** v0.3 的原算式（零调制专用，改它等于改历史窗口，禁改） */
function uAtUnmodulated(mover              , tMs        )         {
    const cycle = mover.cycleMs;
    if (!(cycle > 0) || !(mover.pathLen > 0)) return 0;
    const t = clamp(localT(mover, tMs), 0, cycle);
    const p = speedProfile(mover.speedStage, cycle);
    // 权重 1 时「匀速全程」的速度基准（px/ms）
    const base = mover.pathLen / cycle / p.norm;
    const d = t <= p.switchMs ? base * p.k1 * t : base * p.k1 * p.switchMs + base * p.k2 * (t - p.switchMs);
    return clamp(d / mover.pathLen, 0, 1);
}

/** 把任意 ms 折回 [0, cycleMs) */
function wrapT(tMs        , cycleMs        )         {
    if (!(cycleMs > 0)) return 0;
    const m = tMs % cycleMs;
    return m < 0 ? m + cycleMs : m;
}

/** 把时间差折到 ±cycleMs/2（判定「早了 / 晚了」用），每个 mover 用自己的 cycleMs */
function wrapDelta(dMs        , cycleMs        )         {
    if (!(cycleMs > 0)) return 0;
    const m = wrapT(dMs, cycleMs);
    return m > cycleMs / 2 ? m - cycleMs : m;
}

/**
 * 完美时机 tStar：解 u(t) = uStar。
 * u(t) 严格单调，二分 40 次 → 精度 cycleMs/2^40（≈1e-9ms），完全确定、可重放。
 */
function tStarOf(uStar        , pathLen        , cycleMs        , speedStage        )         {
    if (!(pathLen > 0) || !(cycleMs > 0)) return 0;
    const p = speedProfile(speedStage, cycleMs);
    const base = pathLen / cycleMs / p.norm;
    // u(t) 的分段线性反函数本可直接解，这里统一用二分，保证「换了路径模板也不会算错」
    let lo = 0;
    let hi = cycleMs;
    for (let i = 0; i < 40; i++) {
        const mid = (lo + hi) / 2;
        const d = mid <= p.switchMs ? base * p.k1 * mid : base * p.k1 * p.switchMs + base * p.k2 * (mid - p.switchMs);
        if (d < uStar * pathLen) lo = mid;
        else hi = mid;
    }
    return (lo + hi) / 2;
}

/**
 * v0.4/v0.5：带正弦调制时重新求完美时机 tStar（解 u(t) = uStar）。
 * u(t) 仍严格单调（amp<1 ⇒ 速度恒正；相位只改速度大小，不改方向），二分 40 次；
 * amp=0 时**直接走 v0.3 的 tStarOf**（逐位兼容），phase=0 时 sineIntegral 走兼容分支（逐位兼容）。
 */
function tStarOfMotion(
    uStar        ,
    pathLen        ,
    cycleMs        ,
    speedStage        ,
    motion              ,
)         {
    if (motion.sineAmp === 0) return tStarOf(uStar, pathLen, cycleMs, speedStage);
    if (!(cycleMs > 0)) return 0;
    let lo = 0;
    let hi = cycleMs;
    for (let i = 0; i < 40; i++) {
        const mid = (lo + hi) / 2;
        if (uOfTSine(mid, cycleMs, speedStage, motion.sineAmp, motion.sinePeriodMs, motion.sinePhase) < uStar) lo = mid;
        else hi = mid;
    }
    return (lo + hi) / 2;
}

/** 累计弧长缓存：同一份 pathPts 只算一次（判定每帧都要用，不能反复 new 数组） */
const CUM_CACHE = new WeakMap                                          ();

function cumsOf(mover              )                                   {
    const hit = CUM_CACHE.get(mover.pathPts);
    if (hit) return hit;
    const cum = cumulativeLengths(mover.pathPts);
    const entry = { cum, total: mover.pathLen > 0 ? mover.pathLen : cum[cum.length - 1] };
    CUM_CACHE.set(mover.pathPts, entry);
    return entry;
}

/**
 * v0.4 惯性位移：只叠加**位置**，不叠加转角（转角叠加会隐性收窄角度容错，不可解释）。
 * 形态：offset(t) = A·sin(2π·f·(t − tStar))·dir，dir = (cos 2πφ, sin 2πφ)。
 * 三个性质：
 *  1) t = tStar 时 offset ≡ 0 ⇒ 完美时机仍是 100%（不会把「神级」变成不可达）；
 *  2) 振幅严格 = A（不放大），只改接近/离开段的轨迹形状；
 *  3) 完全确定：无随机、无状态，同 seed 逐帧一致；φ 让同季不同关手感不同。
 */
function inertiaOffsetOf(mover              , tMs        )       {
    const m = moverMotion(mover);
    if (!(m.inertiaPx > 0) || !(m.inertiaHz > 0) || !(mover.cycleMs > 0)) return v(0, 0);
    // localT 只在这里减一次 offset（错拍关 mover1 的 offset≠0）；zeroMs = 该 mover 自己的 tStar
    const t = localT(mover, tMs);
    const dtSec = (t - m.zeroMs) / 1000;
    const s = Math.sin(2 * Math.PI * m.inertiaHz * dtSec) * m.inertiaPx;
    const a = 2 * Math.PI * m.inertiaPhase;
    return v(s * Math.cos(a), s * Math.sin(a));
}

/**
 * 某时刻的姿态（位置 + 旋转角）。正弦只改 u(t)，惯性只改位置，转角始终线性于本地时间。
 *
 * ⚠️ 时间基准纪律：`uAt` 和 `inertiaOffsetOf` **内部各自**都会做 localT（减 offset），
 * 所以这里必须把**原始 tMs** 传给它们，不能用已经减过 offset 的局部时间 t。
 * （v0.6 在这里连踩两次：先漏了 uAt、后漏了 inertia —— 症状分别是「mover1 窗口=0」和
 *  「mover1 在自己的完美时刻偏 0.5–1.4px、角偏恒为 0」。两处现在都传 tMs。）
 */
function poseAt(mover              , tMs        )       {
    const cycle = mover.cycleMs;
    const t = localT(mover, tMs); // 只用于旋转（转角线性于本地时间）
    const u = uAt(mover, tMs);
    const c = cumsOf(mover);
    const p = pointAtU(mover.pathPts, c.cum, c.total, u);
    const rotDeg = mover.startRot + (360 * mover.turns * t) / cycle;
    const m = moverMotion(mover);
    if (m.inertiaPx > 0) {
        const off = inertiaOffsetOf(mover, tMs); // 传原始时间，offset 只减一次
        return { x: p.x + off.x, y: p.y + off.y, rotDeg };
    }
    return { x: p.x, y: p.y, rotDeg };
}

/**
 * 物体绘制/判定的缩放倍率：让物体的「长边」= 目标轮廓的长边（双车道 0.62 也自动成立）。
 * 由 targetArea 反推，保证「判到的面积」与「看到的面积」同源。
 */
function objectScaleOf(mover              )         {
    const unitArea = shapeUnitArea(mover.shape);
    const worldAreaAt1 = unitArea * mover.shape.size * mover.shape.size;
    if (!(worldAreaAt1 > 1e-9) || !(mover.targetArea > 0)) return 1;
    return Math.sqrt(mover.targetArea / worldAreaAt1);
}

/** t 时刻物体的世界轮廓（与 targetPts 同一份坐标口径） */
function objectPtsAt(mover              , tMs        )         {
    const pose = poseAt(mover, tMs);
    const k = mover.shape.size * objectScaleOf(mover);
    return place(scaleLocal(mover.shape.pts, k), pose.x, pose.y, pose.rotDeg);
}

/** 确定性随机数（mulberry32）：同 seed 同序列，跨平台一致（不依赖 Math.random） */
function mulberry32(seed        )               {
    let a = seed >>> 0;
    return function next()         {
        a = (a + 0x6d2b79f5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

/** 本周期实际时长：整局抽一次 ±jitter，路径与 uStar 的相对关系不变 */
function jitteredCycle(baseMs        , jitter        , rnd              )         {
    const j = clamp(jitter, 0, 0.15);
    if (j <= 0) return baseMs;
    return baseMs * (1 + (rnd() * 2 - 1) * j);
}

/** 起始角：使 rot(tStar) ≡ 0 (mod 360)，即完美时机物体正好「转正」 */
function startRotOf(turns        , tStar        , cycleMs        )         {
    if (!(cycleMs > 0)) return 0;
    return normDeg((-360 * turns * tStar) / cycleMs);
}

        onTimeMs: ON_TIME_MS,
        combo: { step: COMBO.step, max: COMBO.max, formula: 'min(2, 1 + step × combo)' },
        modeCoef: { campaign: MODE_COEF.campaign, endless: MODE_COEF.endless },
        starSplit: STAR_SPLIT,

/** y 水平线上的交点 x（升序，偶数个） */
function crossingsAt(pts        , y        )           {
    const xs           = [];
    const n = pts.length;
    for (let i = 0; i < n; i++) {
        const a = pts[i];
        const b = pts[(i + 1) % n];
        if ((a.y <= y && b.y > y) || (b.y <= y && a.y > y)) {
            xs.push(a.x + ((y - a.y) * (b.x - a.x)) / (b.y - a.y));
        }
    }
    xs.sort((m        , n2        ) => m - n2);
    return xs;
}

/** 多边形在 y 处的横截面区间（凹多边形会有多段） */
function sectionsAt(pts        , y        )                          {
    const xs = crossingsAt(pts, y);
    const out                          = [];
    for (let i = 0; i + 1 < xs.length; i += 2) out.push([xs[i], xs[i + 1]]);
    return out;
}

/** 两多边形的横截面交集区间 */
function overlapSectionsAt(P        , Q        , y        )                          {
    const sp = sectionsAt(P, y);
    const sq = sectionsAt(Q, y);
    const out                          = [];
    for (let i = 0; i < sp.length; i++) {
        for (let j = 0; j < sq.length; j++) {
            const lo = Math.max(sp[i][0], sq[j][0]);
            const hi = Math.min(sp[i][1], sq[j][1]);
            if (hi > lo) out.push([lo, hi]);
        }
    }
    return out;
}

/**

function overlapStrips(P        , Q        , bandPx        )              {
    const out              = [];
    if (P.length < 3 || Q.length < 3) return out;
    const h = Math.max(1, bandPx);
    let minY = Infinity;
    let maxY = -Infinity;
    for (const p of P) {
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
    }
    for (const q of Q) {
        if (q.y < minY) minY = q.y;
        if (q.y > maxY) maxY = q.y;
    }
    if (!(maxY > minY)) return out;
    for (let y0 = minY; y0 < maxY; y0 += h) {
        const y1 = Math.min(y0 + h, maxY);
        const yMid = (y0 + y1) / 2;
        for (const seg of overlapSectionsAt(P, Q, yMid)) {
            const x0 = seg[0];
            const x1 = seg[1];
            if (x1 - x0 <= 1e-9) continue;
            out.push({ x: x0, y: y0, w: x1 - x0, h: y1 - y0 });
        }
    }
    return out;
}

/** 区间差：union 里挖掉 inter（两边都是已排序、互不相交的区间列表） */

    const out                          = [];
    for (const u of union) {
        let cur = u[0];
        for (const s of inter) {
            if (s[1] <= cur || s[0] >= u[1]) continue;
            if (s[0] > cur) out.push([cur, Math.min(s[0], u[1])]);
            cur = Math.max(cur, s[1]);
            if (cur >= u[1]) break;
        }
        if (cur < u[1]) out.push([cur, u[1]]);
    }
    return out;
}

    let maxY = -Infinity;

        if (p.y > maxY) maxY = p.y;

function heatBands(objectPts        , targetPts        , count         = 24)              {

    const n = Math.max(1, Math.floor(count));
    if (objectPts.length < 3 || targetPts.length < 3) return out;
    let minY = Infinity;
    let maxY = -Infinity;
    for (const p of objectPts) {
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
    }
    for (const p of targetPts) {
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
    }
    if (!(maxY > minY)) return out;
    const h = (maxY - minY) / n;
    for (let i = 0; i < n; i++) {
        const y0 = minY + i * h;
        const y1 = y0 + h;
        const yMid = (y0 + y1) / 2;
        const st = sectionsAt(targetPts, yMid);
        let tgtX0 = 0;
        let tgtX1 = 0;
        let widest = -1;
        for (const s of st) {
            const w = s[1] - s[0];
            if (w > widest) {
                widest = w;
                tgtX0 = s[0];
                tgtX1 = s[1];
            }
        }
        const hits = overlapSectionsAt(objectPts, targetPts, yMid);
        let hitX0 = (tgtX0 + tgtX1) / 2;
        let hitX1 = hitX0;
        if (hits.length > 0) {
            hitX0 = hits[0][0];
            hitX1 = hits[0][1];
            for (let k = 1; k < hits.length; k++) {
                hitX0 = Math.min(hitX0, hits[k][0]);
                hitX1 = Math.max(hitX1, hits[k][1]);
            }
        }
        out.push({ y0, y1, tgtX0, tgtX1, hitX0, hitX1 });

function judge(rt              , pressMs        , combo         = 0)              {

    for (let i = 0; i < movers.length; i++) {
        const o = judgeMover(movers[i], pressMs);
        objects[i] = o;
        sumPct += o.pct;
        if (o.pct < minPct) minPct = o.pct;

        rating: rule.id,
        baseScore: rule.baseScore,
        score: scoreOf(pct, combo),
        pass: movers.length > 0 && minPct >= def.passRate * 100,
        star3: pct >= def.star3Rate * 100,
        timing: { deltaMs, verdict },
        objects,

        if (j.pct < worstPct) worstPct = j.pct;
    }
    const judgedCount = seen.size;
    const allJudged = need > 0 && judgedCount === need;
    const w = isFinite(worstPct) ? worstPct : 0;
    const allPass = allJudged && w >= rt.def.passRate * 100;
    const rule = ratingOf(allPass ? w : Math.min(w, rt.def.passRate * 100 - 1e-9));
    return {
        pass: allPass,
        rating: allPass ? rule.id : 'fail',
        baseScore: allPass ? rule.baseScore : 0,
        score: allPass ? scoreOf(w, combo) : 0,
        worstPct: w,
        judgedCount,
        needCount: need,
    };
}

/** 单个 mover 的窗口（错拍关每个 mover 有自己的完美时刻与周期） */
function moverWindowAt(
    rt              ,
    index        ,
    ok                          ,
    precisionMs         = 0.5,
    maxIter         = 20,
)            {
    const empty            = { earlyMs: 0, lateMs: 0, earlyWide: false, lateWide: false };
    const mv = rt.movers[index];
    if (!mv || !(mv.cycleMs > 0)) return empty;
    const cyc = mv.cycleMs;
    const pm = moverTiming(mv).perfectMs;
    const lim = cyc * 0.5 * 0.999;
    const side = (sign        )                                => {
        if (!ok(judgeMover(mv, pm).pct)) return { ms: 0, wide: false };
        if (ok(judgeMover(mv, pm + sign * lim).pct)) return { ms: sign * lim, wide: true };
        let lo = 0;
        let hi = lim;
        for (let i = 0; i < Math.min(40, maxIter) && hi - lo > precisionMs; i++) {
            const mid = (lo + hi) / 2;
            if (ok(judgeMover(mv, pm + sign * mid).pct)) lo = mid;
            else hi = mid;
        }
        return { ms: sign * lo, wide: false };
    };
    const e = side(-1);
    const l = side(1);
    return { earlyMs: e.ms, lateMs: l.ms, earlyWide: e.wide, lateWide: l.wide };
}

function hitWindowForMover(rt              , index        )            {
    return moverWindowAt(rt, index, (p) => p >= rt.def.passRate * 100);
}

function godWindowForMover(rt              , index        )            {
    return moverWindowAt(rt, index, (p) => p >= 95);
}

function starWindowForMover(rt              , index        )            {
    const thr = rt.def.star3Rate * 100;
    return moverWindowAt(rt, index, (p) => p >= thr);
}

/** 关卡窗口 = 各 mover 窗口中**较窄者**（规格 §3；玩家必须两边都卡准） */
function tighterWindow(windows             )            {
    if (windows.length === 0) return { earlyMs: 0, lateMs: 0, earlyWide: false, lateWide: false };
    const width = (w           )         => (Math.abs(w.earlyMs) + Math.abs(w.lateMs)) / 2;
    let best = windows[0];
    for (let i = 1; i < windows.length; i++) if (width(windows[i]) < width(best)) best = windows[i];
    return { earlyMs: best.earlyMs, lateMs: best.lateMs, earlyWide: best.earlyWide, lateWide: best.lateWide };
}

/** 每个 mover 的命中窗口（数组，按 mover 下标；错拍关导出的 `hitWindowByMover` 就是这个） */
function hitWindowByMover(rt              )              {
    return rt.movers.map((_, i) => hitWindowForMover(rt, i));
}

/** 每个 mover 的神级窗口 */
function godWindowByMover(rt              )              {
    return rt.movers.map((_, i) => godWindowForMover(rt, i));
}

/** 每个 mover 各自的完美时刻（ms） */
function perfectMsByMover(rt              )           {
    return rt.movers.map((m) => moverTiming(m).perfectMs);
}

/** 每个 mover 的三窗口 + 关卡窗口（较窄者）。错拍关导出用它 */
function perMoverWindows(rt              )   
                     
                     
                      
                        
                        
                         
  {
    const hit = rt.movers.map((_, i) => hitWindowForMover(rt, i));
    const god = rt.movers.map((_, i) => godWindowForMover(rt, i));
    const star = rt.movers.map((_, i) => starWindowForMover(rt, i));
    return { hit, god, star, levelHit: tighterWindow(hit), levelGod: tighterWindow(god), levelStar: tighterWindow(star) };
}

/** 命中窗口 + 由窗口推出的「角度容错 / 位移容错」（策划调数值的主指标） */
function windowMetrics(rt              )                {
    // 错拍关：窗口取较窄者，容错按**各自基准**折算
    if (isDesyncRuntime(rt)) {
        const pmw = perMoverWindows(rt);
        const w = pmw.levelHit;
        const mv0 = rt.movers[0];
        const omega = mv0 && mv0.cycleMs > 0 ? (360 * Math.abs(mv0.turns)) / (mv0.cycleMs / 1000) : 0;
        const tightMs = Math.min(Math.abs(w.earlyMs), Math.abs(w.lateMs));
        let maxPx = 0;
        for (let i = 0; i < rt.movers.length; i++) {
            const mv = rt.movers[i];
            const pm = moverTiming(mv).perfectMs;
            const d = Math.min(Math.abs(pmw.hit[i].earlyMs), Math.abs(pmw.hit[i].lateMs));
            const off = Math.max(judgeMover(mv, pm - d).offsetPx, judgeMover(mv, pm + d).offsetPx);
            if (off > maxPx) maxPx = off;
        }
        return { ...w, tolDeg: (omega * tightMs) / 1000, tolPx: maxPx };
    }
    const w = hitWindow(rt);
    const m0 = rt.movers[0];
    const omega = m0 && m0.cycleMs > 0 ? (360 * Math.abs(m0.turns)) / (m0.cycleMs / 1000) : 0;
    const tightMs = Math.min(Math.abs(w.earlyMs), Math.abs(w.lateMs));
    const maxOffsetAt = (dt        )         => {
        const r = judge(rt, rt.perfectMs + dt);
        let mx = 0;
        for (let i = 0; i < r.objects.length; i++) {
            if (r.objects[i].offsetPx > mx) mx = r.objects[i].offsetPx;
        }
        return mx;
    };
    return {
        earlyMs: w.earlyMs,
        lateMs: w.lateMs,
        earlyWide: w.earlyWide,
        lateWide: w.lateWide,
        tolDeg: (omega * tightMs) / 1000,
        tolPx: Math.min(maxOffsetAt(w.earlyMs), maxOffsetAt(w.lateMs)),
    };
}

/** 形心距（给调试面板 / 文案用） */
function centroidDistance(pts        , target      )         {
    const c = polyCentroid(pts);
    return Math.hypot(c.x - target.x, c.y - target.y);
}

/** 加载 levels.json → LevelDef[]（按 id 升序）。有致命错误直接抛。 */

            { n: 2, amp: 0.26, dec: 1.70, phase: 0.19, detune: 5 },
            { n: 3, amp: 0.075, dec: 0.95, phase: 0.38, detune: 4 }
        ],
        /* 音块 / 钢片琴：2、3 次谐波刻意不在（钢片琴的特征就是"略空"的纯音），
           第 4 次给一点手指触碰的金属味，但 300ms 就衰掉 */
        mallet: [
            { n: 1, amp: 1.00, dec: 0.95, phase: 0.00 },
            { n: 4, amp: 0.16, dec: 0.28, phase: 0.41 },
            { n: 6, amp: 0.055, dec: 0.14, phase: 0.73 }

    /* ================================================================
     * §6 频率表（给定值，不自己算；其余八度由 D4 表倍频外推）
     * ================================================================ */
    var TABLE = {
        'D3': 146.83, 'F#3': 185.00, 'A3': 220.00,
        'D4': 293.66, 'E4': 329.63, 'F#4': 369.99, 'A4': 440.00, 'B4': 493.88,
        'D5': 587.33, 'E5': 659.25, 'F#5': 739.99, 'A5': 880.00, 'B5': 987.77,
        'D6': 1174.66
    };
    var OCT4 = { 'D': 293.66, 'E': 329.63, 'F#': 369.99, 'A': 440.00, 'B': 493.88 };

    function pitchClass(name) {
        var m = /^([A-G]#?)(-?\d+)$/.exec(String(name));
        if (!m) throw new Error('音名格式错误: ' + name);
        return m[1];
    }

    /** 音名 → Hz（同调式外推：跨八度 = 倍频） */
    function hz(name) {
        var n = String(name).trim();
        if (TABLE[n] !== undefined) return TABLE[n];
        var pc = pitchClass(n);
        var oct = parseInt(/([0-9]+)$/.exec(n)[1], 10);
        if (OCT4[pc] === undefined) throw new Error('不在五声音阶内的音名: ' + name);
        return OCT4[pc] * Math.pow(2, oct - 4);
    }

    var SEMI = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
    function transposeOctave(name, deltaOct) {
        var pc = pitchClass(name);

        return pc + (oct + deltaOct);
    }
    function octaveUp(name) { return transposeOctave(name, 1); }
    function twoOctDown(name) { return transposeOctave(name, -2); }
    function cents(f, c) { return f * Math.pow(2, c / 1200); }

    /* ================================================================
     * §1 和弦（Dmaj7 → A → Bm7 → Gmaj7）
     * 注意：每个和弦只取**五声音阶内的音**（Dmaj7 的 C#、Gmaj7 的 G 一律不弹），
     * 这是 §0「同调式」的硬约束，不是省略。
     * ================================================================ */
    var CHORDS = {
        Dmaj7: { label: 'Dmaj7', pad: ['D4', 'F#4', 'A4', 'D5'], root: 'D4', fifth: 'A4' },
        A: { label: 'A', pad: ['A3', 'E4', 'A4', 'D5'], root: 'A3', fifth: 'E4' },
        Bm7: { label: 'Bm7', pad: ['B3', 'D4', 'F#4', 'A4'], root: 'B3', fifth: 'F#4' },
        Gmaj7: { label: 'Gmaj7', pad: ['B3', 'D4', 'F#4', 'A4'], root: 'B3', fifth: 'F#4' }
    };
    var PROGRESSION = ['Dmaj7', 'A', 'Bm7', 'Gmaj7'];

    /* ================================================================
     * §1 BGM 事件表（纯数据；两种渲染器都只读这张表）
     * 事件字段：
     *   t/dur  : 秒
     *   tone   : TONE 预设名（'pluck' | 'pad' | 'mallet' | 'sub'）
     *   freq   : Hz（基频）
     *   gainDb : 相对音量
     *   env    : { a, d } 秒（平滑 attack + 指数 decay）
     *   air    : 起音噪声的音量（dB，缺省 = 无）—— 拨弦/音块的"触弦感"
     *   lp     : 附加的一极点低通（只用于噪声；谐波已由预设控制，tone 不再需要）
     *   band   : { f0, f1, q } 噪声带通（f1 缺省 = 不扫频）
     *   name   : 音名（仅用于 A3/A4 检验与打印，不参与发声）
     * ================================================================ */
    function buildBgmEvents() {
        var ev = [];
        var beat = SPEC.beat;
        var bar = SPEC.bar;

        for (var b = 0; b < SPEC.bars; b++) {
            var chord = CHORDS[PROGRESSION[b % PROGRESSION.length]];
            var t0 = b * bar;

            /* pad：整小节，attack 400ms，双路失谐 ±4 音分。
               四颗音按 60ms 阶梯**错开进入**：齐奏会让四个正弦在起音处相位对齐，
               峰值冲高 6dB（峰均比恶化），错开后变成柔和的铺底呼吸。 */
            for (var p = 0; p < chord.pad.length; p++) {
                ev.push({
                    name: chord.pad[p], t: t0 + p * 0.06, dur: bar - p * 0.06,
                    tone: 'pad', freq: hz(chord.pad[p]), cents: 4,
                    gainDb: -18, env: { a: 0.70, d: 3.20 }, kind: 'pad'
                });
            }

            /* 低音：根音低两个八度，attack 300ms，比 pad 低 5dB */
            ev.push({
                name: twoOctDown(chord.root), t: t0, dur: bar,
                tone: 'sub', freq: hz(twoOctDown(chord.root)), cents: 0,
                gainDb: -16, env: { a: 0.30, d: 6.50 }, kind: 'bass'
            });

            /* 拨弦：第 1、3 拍 = 根音+五度；第 2、4 拍后半拍 = 高八度装饰音
               air = 起音噪声（-34dB，25ms），这一层是"毡槌敲上去"的实体感 */
            var plucks = [
                { n: chord.root, at: 0, gain: 0 },
                { n: chord.fifth, at: 0, gain: -4 },
                { n: chord.root, at: 2 * beat, gain: 0 },
                { n: chord.fifth, at: 2 * beat, gain: -4 },
                { n: octaveUp(chord.root), at: 1.5 * beat, gain: -9 },
                { n: octaveUp(chord.root), at: 3.5 * beat, gain: -9 }

            for (var q = 0; q < plucks.length; q++) {

                    name: plucks[q].n, t: t0 + plucks[q].at, dur: 1.4,
                    tone: 'pluck', freq: hz(plucks[q].n), cents: 3,
                    gainDb: -14 + (plucks[q].gain || 0), air: -38,
                    env: { a: 0.006, d: 2.60 }, kind: 'pluck'
                });
            }

            /* 沙锤：带通噪声 4–6kHz，40ms，每拍后半拍，-34dB（只要能听见"沙"） */
            for (var k = 0; k < 4; k++) {
                ev.push({
                    name: null, t: t0 + k * beat + beat * 0.5, dur: 0.06,
                    wave: 'noise', gainDb: -34, env: { a: 0.002, d: 0.28 },
                    band: { f0: 4000, f1: 6000, q: 1.2 }, kind: 'shaker'
                });
            }
        }
        return ev;
    }

    var BGM_EVENTS = buildBgmEvents();

    /* ================================================================
     * §1b BGM 多轨（v0.3.0）
     *
     * 需求来源：BGM 提示词文档（3 套，适配 Suno / Udio / Soundraw）
     *   场景定位：深夜 / 午休 / 候车，碎片化休闲；玩法是手眼反应
     *   核心原则：放松舒缓、不抢注意力、轻微氛围感、不盖过点击/定格音效、
     *            长时间循环不烦躁
     *
     * 三套的**共同硬约束**（都可自动断言，见 tools/audio_check.mjs A12x）：
     *   - BPM ∈ [75, 80]（文档明确"不要更快"，太快增加紧张感）
     *   - 无强鼓点：没有 kick / snare 这类低频瞬态重击（见各轨 percussion 字段）
     *   - 动态平缓：任一小节的 RMS 起伏 ≤ 3dB，全程无突强突弱
     *   - 无缝 loop：最后一个小节的尾音时长 == 小节长，首尾样本连续
     *   - 调式：只用 D 大调五声音阶 { D, E, F#, A, B }
     *   - 旋律记忆点弱：不写"钩子"，音高走向以级进为主
     *
     * 三套的**风格差异**（对应用户文档的三个版本）：
     *   v1 minimal  —— 80BPM · 极简 lofi 钢琴 · 只有钢琴 + 极淡垫音，无鼓
     *   v2 lofi     —— 75BPM · 钢琴 + 极淡刷镲 + 轻微黑胶沙沙 + 房间底噪
     *   v3 ambient  —— 78BPM · 极简钢琴 + 弦乐垫（无打击乐、无黑胶噪点，最干净）
     *
     * 与 v0.2 原 BGM（id: 'warm'）的关系：原曲保留为第四轨，作为对照 / 旧存档兼容。
     * ================================================================ */

    /** 五声音阶区间的音名工具：把一个音限制在给定八度范围内 */
    function inRange(name) { return name; }

    /* 循环末尾的"出血"时长（秒）：让最后一小节的长音多响这么久，
       由 renderBgm(..., seamless=true) 把这段尾巴绕回开头。
       取值要 ≥ 延迟混响的收敛时间（delay 0.28s × 8 轮 ≈ 2.3s），
       否则绕回段自己也会在半路断掉。 */
    var BLEED = 3.0;

    /* ---------- 轨道 1：极简版（对应提示词版本 1 · Suno · 80BPM） ----------
     * 曲式：4 小节循环，D 大调五声音阶
     *   每小节：1 个钢琴低音长音（撑住和声）+ 3~4 颗钢琴单音（右手中高音区）
     *   刻意不用鼓、不用沙锤、不用拨弦 —— 只剩"钢琴 + 一层几乎听不见的垫音"
     * 旋律写法遵循"记忆点弱"：音域控制在 D4–B4，相邻音级进（2~4 个半音），
     *   不做跳进、不重复同一句 —— 听久了不会哼，也就不会烦。
     */
    function buildMinimalEvents() {

        var ev = [];
        var beat = 60 / 80;        /* 0.75s */
        var bar = beat * 4;        /* 3.0s  */
        var bars = 8;              /* 8 小节 = 24.0s */

        /* 长音（bass / pad）的 T60：取"一整圈刚刚衰减 15dB"。
           这样每圈起点的电平完全一致 —— 循环接缝天然自洽，不必靠淡入淡出掩盖。
           15dB 是实测扫出来的（对比 15/20/30dB 三档的 动态 & 接缝）：
             15dB → 动态 7.3~8.6dB · 接缝 1.1~2.6dB   ← 采用
             20dB → 动态 6.7~10.3dB · 接缝 1.6~2.9dB
             30dB → 动态 6.6~12.2dB · 接缝 2.5~3.4dB
           衰减越少，圈尾电平越接近圈头，接缝越连续。 */
        var loopT60 = (bars * bar) / ((15 / 20) * Math.LN10) * 6.9078;

        /* 和声：每 2 小节换一次（比每小节换更"缓"，符合"无强烈和弦变化"） */
        var harm = [
            { pad: ['D4', 'A4'], root: 'D3' },
            { pad: ['D4', 'A4'], root: 'D3' },
            { pad: ['B3', 'F#4'], root: 'B2' },
            { pad: ['B3', 'F#4'], root: 'B2' },
            { pad: ['A3', 'E4'], root: 'A2' },
            { pad: ['A3', 'E4'], root: 'A2' },
            { pad: ['B3', 'D4'], root: 'B2' },
            { pad: ['B3', 'D4'], root: 'B2' }
        ];

        /* 右手单音旋律：每小节 3 颗，落在"拍点上但不密"。
           刻意避开每小节第 1 拍的正拍（让钢琴低音先说话），
           用 2、3.5、4 拍的位置 —— 听起来像"有人在慢慢弹，不是在打拍子"。 */
        var line = [
            [['A4', 1.00, -2], ['B4', 2.20, -6], ['A4', 3.00, -9]],
            [['F#4', 1.00, -3], ['A4', 2.20, -7], ['E4', 3.00, -10]],
            [['E4', 1.00, -3], ['F#4', 2.20, -6], ['D4', 3.00, -9]],
            [['B3', 1.00, -4], ['D4', 2.20, -7], ['E4', 3.00, -10]],
            [['A3', 1.00, -3], ['B3', 2.20, -7], ['D4', 3.00, -9]],
            [['E4', 1.00, -4], ['D4', 2.20, -7], ['B3', 3.00, -10]],
            [['D4', 1.00, -3], ['E4', 2.20, -6], ['B3', 3.00, -9]],
            [['D4', 1.00, -3], ['A4', 2.20, -6], ['F#4', 3.00, -9]]
        ];

        for (var b = 0; b < bars; b++) {
            var t0 = b * bar;
            var h = harm[b];

            /* 钢琴低音：一小节一颗，长按，-20dB，attack 60ms（不敲、是"按下"） */
            ev.push({
                name: h.root, t: t0, dur: bar + BLEED,
                tone: 'pluck', freq: hz(h.root), cents: 0,
                gainDb: -20, air: -46, env: { a: 0.060, d: loopT60, hold: true }, kind: 'bass'
            });

            /* 垫音：两音，几乎听不见（-30dB），只为补一点点空气 */
            for (var p = 0; p < h.pad.length; p++) {
                ev.push({
                    name: h.pad[p], t: t0 + p * 0.12, dur: bar + BLEED,
                    tone: 'pad', freq: hz(h.pad[p]), cents: 3,
                    gainDb: -30, env: { a: 1.10, d: loopT60, hold: true }, kind: 'pad'
                });
            }

            /* 右手单音 */
            for (var q = 0; q < line[b].length; q++) {
                var n = line[b][q];
                ev.push({
                    name: n[0], t: t0 + n[1] * beat * 0.25 + 0, dur: 1.6,
                    tone: 'pluck', freq: hz(n[0]), cents: 2,
                    gainDb: -13 + n[2], air: -42, env: { a: 0.008, d: 2.2 }, kind: 'pluck'
                });
            }
        }
        return { events: ev, bpm: 80, bars: bars, barSeconds: bar, loopSeconds: bars * bar };
    }

    /* ---------- 轨道 2：细节完整版（对应提示词版本 2 · Udio · 75BPM） ----------
     * 在轨道 1 的骨架上加三样东西（都是"极淡"）：
     *   - brush：刷镲（带通噪声 3.2–7kHz，-40dB，每拍一次但音量极低、无重击）
     *   - vinyl：黑胶细碎沙沙（持续极低电平白噪 + 稀疏爆点）
     *   - room ：房间底噪（-52dB 宽带噪声，让音色"有空间"）
     * 并比轨道 1 多两颗装饰音，和声每小节换（更"爵士"一点）。
     * 注意：这里**没有 kick / snare**，brush 是刷出来的连续噪声，不是鼓点重击。
     */
    function buildLofiEvents() {

        var ev = [];
        var beat = 60 / 75;        /* 0.80s */
        var bar = beat * 4;        /* 3.2s  */
        var bars = 8;              /* 8 小节 = 25.6s */

        /* 长音（bass / pad）的 T60：取"一整圈刚刚衰减 15dB"。
           这样每圈起点的电平完全一致 —— 循环接缝天然自洽，不必靠淡入淡出掩盖。
           15dB 是实测扫出来的（对比 15/20/30dB 三档的 动态 & 接缝）：
             15dB → 动态 7.3~8.6dB · 接缝 1.1~2.6dB   ← 采用
             20dB → 动态 6.7~10.3dB · 接缝 1.6~2.9dB
             30dB → 动态 6.6~12.2dB · 接缝 2.5~3.4dB

        var loopT60 = (bars * bar) / ((15 / 20) * Math.LN10) * 6.9078;

            { pad: ['B3', 'D4', 'F#4'], root: 'B2', fifth: 'F#3' },
            { pad: ['A3', 'D4', 'E4'], root: 'A2', fifth: 'E3' },
            { pad: ['A3', 'D4', 'E4'], root: 'A2', fifth: 'E3' },
            { pad: ['B3', 'D4', 'F#4'], root: 'B2', fifth: 'F#3' },
            { pad: ['B3', 'D4', 'F#4'], root: 'B2', fifth: 'F#3' }
        ];

        /* 右手：每小节 4 颗，第 4 颗是"上一颗的回音"（低 6dB、晚 0.5 拍） */
        var line = [
            [['A4', 1.00, -2], ['B4', 1.90, -5], ['A4', 2.75, -7], ['F#4', 3.40, -10]],
            [['F#4', 1.00, -3], ['E4', 1.90, -6], ['D4', 2.75, -8], ['E4', 3.40, -11]],
            [['E4', 1.00, -3], ['F#4', 1.90, -5], ['A4', 2.75, -7], ['F#4', 3.40, -10]],
            [['D4', 1.00, -4], ['B3', 1.90, -7], ['D4', 2.75, -8], ['E4', 3.40, -11]],
            [['A3', 1.00, -3], ['B3', 1.90, -6], ['D4', 2.75, -8], ['B3', 3.40, -11]],
            [['E4', 1.00, -4], ['D4', 1.90, -6], ['B3', 2.75, -8], ['A3', 3.40, -11]],
            [['D4', 1.00, -3], ['E4', 1.90, -6], ['F#4', 2.75, -7], ['D4', 3.40, -10]],
            [['D4', 1.00, -3], ['A4', 1.90, -5], ['F#4', 2.75, -7], ['E4', 3.40, -10]]
        ];

        for (var b = 0; b < bars; b++) {
            var t0 = b * bar;
            var h = harm[b];

            /* 钢琴低音 + 五度（比轨道 1 多一颗五度，更像爵士 comping） */
            ev.push({
                name: h.root, t: t0, dur: bar + BLEED,

                tone: 'pluck', freq: hz(h.fifth), cents: 2,

            });

            for (var p = 0; p < h.pad.length; p++) {
                ev.push({
                    name: h.pad[p], t: t0 + p * 0.10, dur: bar + BLEED,
                    tone: 'pad', freq: hz(h.pad[p]), cents: 4,
                    gainDb: -28, env: { a: 0.90, d: loopT60, hold: true }, kind: 'pad'
                });
            }

            /* 右手 */
            for (var q = 0; q < line[b].length; q++) {
                var n = line[b][q];
                ev.push({
                    name: n[0], t: t0 + n[1] * beat, dur: 1.8,
                    tone: 'pluck', freq: hz(n[0]), cents: 3,
                    gainDb: -13 + n[2], air: -42, env: { a: 0.007, d: 2.4 }, kind: 'pluck'
                });
            }

            /* 刷镲：每拍一次，带通 3.2–7kHz，很短（90ms），-40dB。
               这是"刷"不是"打"：起音 8ms 平滑（不是 1ms 硬起振），所以没有敲击感。 */
            for (var k = 0; k < 4; k++) {
                ev.push({
                    name: null, t: t0 + k * beat, dur: 0.10,
                    wave: 'noise', gainDb: -40, env: { a: 0.008, d: 0.30 },
                    band: { f0: 3200, f1: 7000, q: 1.0 }, kind: 'brush'
                });

        }

           做法：一条长事件，电平极低（-56dB），带通压在中频，听感是"唱片底噪"。
           稀疏爆点（表面划痕）另用少量短事件点缀，平均每 2 秒一颗。 */
        var vinylLen = bars * bar;
        ev.push({
            name: null, t: 0, dur: vinylLen,
            wave: 'noise', gainDb: -56, env: { a: 0.30, d: vinylLen, hold: true },
            band: { f0: 1200, f1: 4000, q: 0.6 }, kind: 'vinyl'
        });

function cycleMs() {
    var m = app.rt && app.rt.movers && app.rt.movers[0];
    return m ? m.cycleMs : 2000;
}
function elapsed() {
    var t = nowMs() - app.attemptStart;
    var c = cycleMs();
    return ((t % c) + c) % c;
}

/* ---------------- 关卡流程（v0.3：两模式判定/评分完全一致，唯一差异是挑战限时） ---------------- */
/**
 * 首页入口：mode='challenge' 每关限时 15s、15 关通关结算；mode='relax' 同样判定/计分，
 * 但没有倒计时，打完 15 关回到第 1 关循环。
 */
function startRun(modeName, fromLevel) {
    app.mode = (modeName === 'relax') ? 'relax' : 'challenge';
    app.totalScore = 0;
    app.godCount = 0;
    app.combo = 0;
    app.levelScore = 0;
    app.round = 1;
    app.runStartAt = nowMs();
    app.seasonShown = 0;      /* 新一局重新展示「第 1 季」 */
    app.seasonIntroAt = -1e9;
    applyModeAudio();
    hideShareTextOverlay(); /* 离开通关页就收起"复制失败"的那层可选文本，别让它悬在游戏画面上 */
    var i = typeof fromLevel === 'number' ? fromLevel : 0;
    i = Math.max(0, Math.min(LEVELS.length - 1, i));
    startLevel(i);
    audioUnlock(); /* §4：只有用户手势里才建 AudioContext + 起 BGM */
}

/** 本关时限（ms）：挑战 = modes.challenge.timeLimitMs，可被单关 timeLimitSec 覆盖；relax = null */
function levelTimeLimit(def) {
    var cfg = MODES[app.mode] || MODES.challenge;
    if (cfg.timeLimitMs === null || cfg.timeLimitMs === undefined) return null;
    if (def && def.timeLimitSec) return Math.round(def.timeLimitSec * 1000);
    return cfg.timeLimitMs;
}

/* ---------------- 关卡表 / 赛季辅助 ---------------- */

/** 当前模式的关卡表（挑战 60 / 催眠 60；催眠读 levelsRelax） */
function curLevels() { return (isRelax() && RELAX_LEVELS && RELAX_LEVELS.length) ? RELAX_LEVELS : LEVELS; }
/** 赛季号：优先读 def.season，缺省按 id 推导（每 15 关一季） */
function seasonOf(def) {
    if (!def) return 1;
    if (def.season) return def.season;
    return Math.max(1, Math.ceil((def.id || 1) / LEVELS_PER_SEASON));
}
/** 每季最后一关（15/30/45/60）→ 绿框呼吸加速 */
function isSeasonEndIdx(idx) { return ((idx + 1) % LEVELS_PER_SEASON) === 0; }
/** 季展示只在挑战模式（催眠不分季，只在 15/30/45/60 给「已完成 N 段」） */
function seasonUiOn() { return !isRelax(); }

function startLevel(i) {
    var list = curLevels();
    if (!list.length) { onErr(new Error('没有关卡数据：__CONFIG__.levels 为空')); return; }
    app.lvl = Math.max(0, Math.min(list.length - 1, i));
    /* D-093：助眠第 2 圈起按 36 池 + 场景顺序表换 shapeId/outlineId；第 1 圈用原表（S2/S3 不动）。
       只换内容、不换难度：cycleMs/turns/path/passRate/variant 全部照抄原关。
       注意：必须在 applySceneForLevel() 之后再换（顺序表按"这一关实际生效的场景"取）。 */
    app.def = list[app.lvl];
    app.attempts = app.def.attempts || 3;
    app.levelScore = 0;
    app.lvlEnterAt = nowMs(); /* 关卡名 400ms 淡入上滑（让"过关了"看得见） */
    app.timeLimitMs = levelTimeLimit(app.def);
    /* v0.4 季入场：「第 N 季」600ms 淡入（只在季首次进入时，跨季才触发） */
    var sea = seasonOf(app.def);
    if (seasonUiOn() && sea !== app.seasonShown) {
        app.seasonShown = sea;
        app.seasonIntroAt = nowMs();
    }
    applySceneForLevel(); /* 只在关卡之间换背景（D-039） */
    /* D-093：场景定下来之后再取这一关的顺序表（第 2 圈起 36 池轮换；第 1 圈用原表）。
       只换内容、不换难度：cycleMs/turns/path/passRate/variant 全部照抄原关（S36 逐字段核）。 */
    if (isRelax() && (app.round || 1) >= (COLLECTION.relaxCycle2.fromRound || 2)) {
        app.def = relaxRotatedDef(app.def, app.lvl, app.round);
    }
    try {
        app.rt = CORE.buildLevel(app.def, SHAPES, 1337 + app.lvl * 97);
    } catch (e) {
        onErr(e);
        return;
    }
    /* v0.6 错拍关：per-mover「已定格」标记（同步关保持 null，HUD/流程完全不受影响）。
       注意 beginAttempt() 会把 frozen 清成 null，所以必须在它之后重置。 */
    beginAttempt();
    if (isDesync()) {
        var n2 = (app.rt && app.rt.movers) ? app.rt.movers.length : 2;
        var fz2 = [];
        for (var k2 = 0; k2 < n2; k2++) fz2.push(false);
        app.frozen = fz2;
    }
}

function beginAttempt() {
    app.scene = 'play';
    app.fb = null;
    app.freezeT = 0;
    app.attemptStart = nowMs();
    /* 计时起点 = 本关第一次物体进场（不是进关那一帧）；重试即重置（M16） */
    app.timerStart = null;
    app.timerStopAt = null;
    /* v0.6 错拍关：每次尝试/重试都把"已定格"标记清零（S21 要求失败后两个 mover 全部重置） */
    app.phase = 'aim';
    /* D-136：必须按 mover 数重建长度正确的 frozen 数组（原本清成 null → 第一次按下会把数组长度变成 1
       → desyncAllFrozen() 误判"都定住了" → 一次点击就结算。首次进关正常、重玩就坏，正是这个 bug） */
    if (typeof isDesync === 'function' && isDesync()) {
        var _n = (app.rt && app.rt.movers) ? app.rt.movers.length : 2;
        var _fz = [];
        for (var _i = 0; _i < _n; _i++) _fz.push(false);
        app.frozen = _fz;
        app.desyncJudged = [];
        app.desyncLast = null;
    } else {
        app.frozen = null;
    }
    app.desyncResolve = null;
    app.desyncFirstAt = 0;   /* D-131：连击保护基准清零 */
    app.desyncTooFastAt = 0;
    app.frozenPose = null;   /* D-134：定格姿态清零 */
    app.desyncFlashAt = 0;
    app.desyncFlashIdx = -1;
}

function restartLevel() {
    app.attempts = app.def.attempts || 3;
    app.levelScore = 0;
    beginAttempt();
}

/** 已用时（毫秒）：面板出现即停表 */
function timerElapsed() {
    if (!app.timeLimitMs) return 0;
    if (app.timerStart == null) return 0;
    var end = (app.timerStopAt != null) ? app.timerStopAt : nowMs();
    return Math.max(0, end - app.timerStart);
}
function timerLeftMs() {
    if (!app.timeLimitMs) return null;
    return Math.max(0, app.timeLimitMs - timerElapsed());
}

/** 超时 = 本关失败：进结算、评级 fail、文案「时间到」、扣掉最后一次机会（M14/M15） */
function triggerTimeout() {
    if (app.scene !== 'play') return;
    var t = nowMs();
    app.timerStopAt = t;
    app.phase = 'result';
    /* 错拍关超时：已定格的半个状态也要清掉（不允许"一个已定格"残留到面板/重试） */
    app.frozen = null;
    app.desyncJudged = null;
    app.attempts = Math.max(0, app.attempts - 1);
    app.combo = 0;
    app.fb = {
        t0: t, pressMs: 0,
        res: {
            pct: 0, rating: 'fail', baseScore: 0, score: 0, pass: false, star3: false,
            timing: { deltaMs: 0, verdict: 'onTime' }, objects: []
        },
        elapsed: 0, revealed: false, settled: true, pass: false, stars: 0,
        attemptsLeft: app.attempts, tier: 'fail', sfxPlayed: true, timeout: true
    };
    app.scene = 'feedback';
    if (AUDIO && MODES[app.mode] && MODES[app.mode].ratingSfx) {
        try { AUDIO.playSfx('fail'); } catch (e) { /* 吃掉 */ }
    }
}

function nextLevel() {
    clearSceneOverride(); /* D-094：渲染期覆盖只活一关，关卡结束即失效 */
    var list = curLevels();
    var done = app.lvl + 1;
    /* 催眠：每 15 关给一次轻提示「已完成 N 段」（不分季展示） */
    if (isRelax() && (FX.relaxStageHint && FX.relaxStageHint.everyN || 15) && done % (FX.relaxStageHint.everyN || 15) === 0 && done < list.length) {
        showToast('已完成 ' + (done / (FX.relaxStageHint.everyN || 15)) + ' 段');
    }
    if (app.lvl + 1 < list.length) { startLevel(app.lvl + 1); return; }
    /* 最后一关之后：挑战 → 通关页；relax → 回到第 1 关继续（记轮次） */
    if (MODES[app.mode] && MODES[app.mode].loop) {
        showToast('第 ' + (app.round || 1) + ' 轮完成');
        app.round = (app.round || 1) + 1;
        startLevel(0);
        return;
    }
    showComplete();
}

function showToast(text) {

}

function showComplete() {
    var t = nowMs();
    clearSceneOverride();
    app.scene = 'complete';
    var ms = Math.max(0, t - (app.runStartAt || t));
    /* 最高分只在挑战模式记录（relax 不参与，别让助眠玩家被分数绑架） */
    if (MODES[app.mode] && MODES[app.mode].recordBest) {
        progress.bestScore = Math.max(progress.bestScore || 0, app.totalScore);
    }
    progress.god = Math.max(progress.god || 0, app.godCount);
    progress.unlocked = Math.max(progress.unlocked || 1, LEVELS.length);
    writeProgress();
    app.complete = {
        score: app.totalScore,
        god: app.godCount,
        best: progress.bestScore || 0,
        ms: ms,
        timeText: Math.floor(ms / 60000) + ':' + ('0' + Math.floor((ms % 60000) / 1000)).slice(-2),
        /* v0.7 B1：文案末尾追加场景名（"· 深夜候车"），名字取 scenes.json 的 name */
        share: buildShareText(app.godCount, app.totalScore)
    };
    /* 进通关页时清掉上一次的复制结果，否则上一局的"链接已复制"会残留在这一局 */
    app.shareCopiedAt = -1e9;
    app.shareFailed = false;
    app.shareUrl = '';

 *  ⚠️ clientX 是 **CSS 像素**；view.scale / view.ox / view.oy 也都是 CSS 像素。
 *  canvas 的 backing store 才乘 dpr（见 applyTransform）。这里**绝不能再除 dpr**——
